name: Refresh assistant telemetry

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/telemetry.yml"
      - "scripts/telemetry.py"

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the card from the live site
        run: python scripts/telemetry.py
      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh assistant telemetry [skip ci]"
            git push
          fi
